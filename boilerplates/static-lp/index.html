<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- ページタイトル・description・OGP/Twitter Card は下記プレースホルダを実際の
         サイト名・訴求文に書き換えること（title と各 description の内容は揃える）。
         og:image / twitter:image は public/og-image.png 等の実画像を追加してから
         書き換えること（本テンプレートには同梱していない）。 -->
    <title>Static LP Boilerplate</title>
    <meta
      name="description"
      content="このサイトの概要・訴求内容をここに記載してください（100〜120文字程度を推奨）。"
    />

    <!-- OGP -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ja_JP" />
    <!-- 公開ドメインが決まったら og:url / og:image を実 URL に書き換える -->
    <meta property="og:url" content="https://example.com/" />
    <meta property="og:title" content="Static LP Boilerplate" />
    <meta
      property="og:description"
      content="このサイトの概要・訴求内容をここに記載してください（100〜120文字程度を推奨）。"
    />
    <meta property="og:image" content="https://example.com/og-image.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Static LP Boilerplate" />
    <meta
      name="twitter:description"
      content="このサイトの概要・訴求内容をここに記載してください（100〜120文字程度を推奨）。"
    />
    <meta name="twitter:image" content="https://example.com/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
