# Air configuration for hot reload development
# https://github.com/air-verse/air

root = "."
tmp_dir = "tmp"

[build]
# Build with the dev tag so the embedded SPA is replaced by the 404 stub
# (Vite serves the frontend in dev).
cmd = "go build -tags dev -o ./bin/server ./cmd/server"
entrypoint = "./bin/server"
include_ext = ["go"]
exclude_dir = ["bin", "vendor", "tmp", "frontend", "internal/static/dist"]
exclude_file = []
exclude_regex = ["_test.go"]
delay = 1000
stop_on_error = true
send_interrupt = true
kill_delay = 500

[log]
time = true

[color]
main = "magenta"
watcher = "cyan"
build = "yellow"
runner = "green"

[misc]
clean_on_exit = true
