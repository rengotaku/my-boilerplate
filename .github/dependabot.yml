version: 2
updates:
  # Python (python-cli)
  - package-ecosystem: "pip"
    directory: "/boilerplates/python-cli"
    schedule:
      interval: "monthly"
    groups:
      python-cli-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Go (go-cli)
  - package-ecosystem: "gomod"
    directory: "/boilerplates/go-cli"
    schedule:
      interval: "monthly"
    groups:
      go-cli-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Go (go-ssr-web)
  - package-ecosystem: "gomod"
    directory: "/boilerplates/go-ssr-web"
    schedule:
      interval: "monthly"
    groups:
      go-ssr-web-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
