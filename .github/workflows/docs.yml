name: Docs Lint

on:
  push:
    branches: [main]
    paths:
      - '**/*.md'
      - '.textlintrc.yml'
      - '.textlintignore'
      - 'prh.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - 'boilerplates/*/template.toml'
      - 'scripts/gen-readme-list.sh'
  pull_request:
    paths:
      - '**/*.md'
      - '.textlintrc.yml'
      - '.textlintignore'
      - 'prh.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/docs.yml'
      - 'boilerplates/*/template.toml'
      - 'scripts/gen-readme-list.sh'

jobs:
  textlint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # このリポジトリ配下の Markdown をまとめて校正する（全テンプレートの
      # README / docs を含む）。textlint はこのリポジトリのルートにだけ入れており、
      # テンプレート側には依存を増やしていない。
      - name: Lint docs
        run: npm run lint:docs

      # README の一覧表が template.toml とずれていないか確かめる
      - name: Check template list
        run: make check-readme-list
