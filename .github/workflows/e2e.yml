name: E2E Integration Tests

on:
  pull_request:
    paths:
      - "boilerplates/react-spa/**"
      - "boilerplates/react-spa-cloudflare/**"
      - "boilerplates/shared-react-ui/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "boilerplates/react-spa/**"
      - "boilerplates/react-spa-cloudflare/**"
      - "boilerplates/shared-react-ui/**"
      - "e2e/**"
      - ".github/workflows/e2e.yml"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      # Matches @playwright/test version in e2e/package-lock.json.
      # When bumping Playwright, update this tag and regenerate VRT baselines
      # with `make e2e-update-snapshots` to keep pixels reproducible.
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: |
            boilerplates/react-spa/package-lock.json
            boilerplates/react-spa-cloudflare/package-lock.json
            e2e/package-lock.json

      - name: Install React SPA dependencies
        working-directory: boilerplates/react-spa
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install React SPA Cloudflare dependencies
        working-directory: boilerplates/react-spa-cloudflare
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run E2E tests (integration + VRT + a11y)
        working-directory: e2e
        run: npx playwright test

      - name: Upload test artifacts
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-test-results
          path: |
            e2e/test-results/
            e2e/playwright-report/
          retention-days: 7
