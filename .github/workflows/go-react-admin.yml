name: go-react-admin CI

# go-react-admin is a standalone Go + React admin-console template (worker+web
# single binary, gin + embed, SQLite metrics store, jsonl persistlog,
# Prometheus). Its frontend composes shared UI + admin components from
# shared-react-ui/ at install time (make compose-ui). This workflow runs the
# full lint + test pipeline whenever go-react-admin/, the shared UI source, or
# this workflow itself is modified.

on:
  push:
    branches: [main]
    paths:
      - 'go-react-admin/**'
      - 'shared-react-ui/**'
      - '.github/workflows/go-react-admin.yml'
  pull_request:
    paths:
      - 'go-react-admin/**'
      - 'shared-react-ui/**'
      - '.github/workflows/go-react-admin.yml'

defaults:
  run:
    working-directory: go-react-admin

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go-react-admin/go.mod
          cache-dependency-path: go-react-admin/go.sum

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: go-react-admin/frontend/.node-version
          cache: 'npm'
          cache-dependency-path: go-react-admin/frontend/package-lock.json

      - name: Install golangci-lint
        run: curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s -- -b "$(go env GOPATH)/bin" v2.11.2

      - name: Compose shared UI + admin components
        run: make compose-ui

      - name: Install dependencies (Go modules + npm install)
        run: make install

      - name: Lint and test (Go + frontend)
        run: make ci
