name: Scaffold Verify python-web flags

# Verifies the python-web feature flags (#308) for all four combinations:
#
#   default             no flags  → auth + items sample, unchanged scaffold
#   no-auth             --no-auth → no login / register / JWT / users
#   no-sample           --no-sample → no items CRUD sample, GET / still works
#   no-auth-no-sample   both
#
# Each variant must pass the file-level checks, `alembic upgrade head` with the
# expected tables, a GET / smoke test and `make ci`.

on:
  push:
    branches: [main]
    paths:
      - 'boilerplates/python-web/**'
      - 'scripts/scaffold/**'
      - '.github/workflows/scaffold-verify-python-web-flags.yml'
  pull_request:
    paths:
      - 'boilerplates/python-web/**'
      - 'scripts/scaffold/**'
      - '.github/workflows/scaffold-verify-python-web-flags.yml'

jobs:
  verify:
    name: python-web (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: default
            flags: ''
            expect_tables: 'items users'
          - variant: no-auth
            flags: 'no-auth=1'
            expect_tables: 'items'
          - variant: no-sample
            flags: 'no-sample=1'
            expect_tables: 'users'
          - variant: no-auth-no-sample
            flags: 'no-auth=1 no-sample=1'
            expect_tables: ''

    env:
      DEST: ${{ runner.temp }}/python-web-${{ matrix.variant }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Scaffold (${{ matrix.variant }})
        env:
          FLAGS: ${{ matrix.flags }}
        run: |
          bash scripts/scaffold/scaffold.sh \
            template=python-web \
            dest="$DEST" \
            name=testapp \
            $FLAGS

      - name: Verify files for the variant
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/scaffold/verify-python-web-flags.sh "$DEST" "$VARIANT"

      - name: Install dependencies
        working-directory: ${{ runner.temp }}/python-web-${{ matrix.variant }}
        run: |
          uv sync --all-extras
          npm install

      - name: Apply the initial migration
        working-directory: ${{ runner.temp }}/python-web-${{ matrix.variant }}
        env:
          DATABASE_URL: sqlite:///./verify.db
        run: uv run alembic upgrade head

      - name: Verify migrated tables (test case 1)
        working-directory: ${{ runner.temp }}/python-web-${{ matrix.variant }}
        env:
          EXPECT_TABLES: ${{ matrix.expect_tables }}
        run: |
          uv run python - <<'PY'
          import os
          import sqlite3

          expected = set(os.environ["EXPECT_TABLES"].split())
          tables = {
              row[0]
              for row in sqlite3.connect("verify.db")
              .execute("select name from sqlite_master where type='table'")
          }
          actual = tables - {"alembic_version", "sqlite_sequence"}
          print("expected:", sorted(expected))
          print("actual:  ", sorted(actual))
          if actual != expected:
              raise SystemExit("migrated tables do not match the variant")
          PY

      - name: GET / returns 200 (test case 3)
        working-directory: ${{ runner.temp }}/python-web-${{ matrix.variant }}
        run: |
          uv run python - <<'PY'
          from fastapi.testclient import TestClient

          from testapp.app import app

          with TestClient(app) as client:
              response = client.get("/")
          print("GET / ->", response.status_code)
          if response.status_code != 200:
              raise SystemExit("GET / is not 200")
          PY

      - name: make ci
        working-directory: ${{ runner.temp }}/python-web-${{ matrix.variant }}
        run: make ci
