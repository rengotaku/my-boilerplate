name: Check Makefile Targets

on:
  pull_request:
    paths:
      - "boilerplates/*/Makefile"
      - "Makefile"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check server Makefiles for stop/status targets
        run: |
          SERVERS="go-rest-api go-graphql-api go-grpc-api go-ssr-web go-ssr-web-minimal go-react-spa go-react-admin react-spa"
          for dir in $SERVERS; do
            mk="boilerplates/$dir/Makefile"
            if [ -f "$mk" ]; then
              grep -q "^stop:" "$mk" || echo "::warning file=$mk::Missing 'stop' target"
              grep -q "^status:" "$mk" || echo "::warning file=$mk::Missing 'status' target"
            fi
          done
