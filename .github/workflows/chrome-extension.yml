name: chrome-extension CI

on:
  push:
    branches: [main]
    paths:
      - 'boilerplates/chrome-extension/**'
      - '.github/workflows/chrome-extension.yml'
  pull_request:
    paths:
      - 'boilerplates/chrome-extension/**'
      - '.github/workflows/chrome-extension.yml'

defaults:
  run:
    working-directory: boilerplates/chrome-extension

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: boilerplates/chrome-extension/.node-version
          cache: 'npm'
          cache-dependency-path: boilerplates/chrome-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test with coverage
        run: |
          npm run test:coverage
          COVERAGE=$(cat coverage/coverage-summary.json | jq '.total.lines.pct')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 80%"
            exit 1
          fi

      - name: Build
        run: npm run build
