name: Deploy static-lp to Cloudflare Pages

env:
  PROJECT_NAME: static-lp

on:
  push:
    branches: [main]
    paths:
      - 'boilerplates/static-lp/**'
      - '.github/workflows/static-lp-deploy.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: boilerplates/static-lp

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: boilerplates/static-lp/package-lock.json

      - name: Compose shared-react-ui
        run: make compose-ui

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=${{ env.PROJECT_NAME }}
          workingDirectory: boilerplates/static-lp
