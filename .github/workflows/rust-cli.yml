name: rust-cli CI

on:
  push:
    branches: [main]
    paths:
      - 'boilerplates/rust-cli/**'
      - '.github/workflows/rust-cli.yml'
  pull_request:
    paths:
      - 'boilerplates/rust-cli/**'
      - '.github/workflows/rust-cli.yml'

defaults:
  run:
    working-directory: boilerplates/rust-cli

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            boilerplates/rust-cli/target/
          key: ${{ runner.os }}-cargo-stable-${{ hashFiles('boilerplates/rust-cli/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint with clippy
        run: cargo clippy -- -D warnings

      - name: Run tests
        run: cargo test

  coverage:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Run tests with coverage
        working-directory: boilerplates/rust-cli
        run: |
          cargo llvm-cov --lib --lcov --output-path lcov.info
          COVERAGE=$(cargo llvm-cov --lib --json | jq '.data[0].totals.lines.percent')
          echo "Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 80" | bc -l) )); then
            echo "Coverage $COVERAGE% is below 80%"
            exit 1
          fi
