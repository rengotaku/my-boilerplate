# 日本語ドキュメントの校正設定。
#
# 無効化したルールには必ず理由を書く。「緑にするために外した」ものは置かない。
# いずれも技術文書の一般的な記法（識別子の列挙・ラベル形式の箇条書き・
# `項目: 値` の半角コロン）と規則が噛み合わないもの。

filters:
  # <!-- textlint-disable ルール名 --> でピンポイントに抑止できるようにする
  comments: true

rules:
  preset-ja-technical-writing:
    sentence-length:
      max: 120
      # 日本語を1文字も含まない文（英語のみの記述）は対象外にする。
      skipPatterns:
        - "/^[^\u3040-\u30ff\u4e00-\u9fff]+$/"

    ja-no-mixed-period:
      # コードブロックや表を導入する行は「〜:」で終える書き方が一般的なので、
      # 半角・全角のコロンも文末記号として許可する。
      allowPeriodMarks: [":", "："]

    no-doubled-joshi:
      min_interval: 1

    no-mix-dearu-desumasu:
      # 箇条書きは「ですます」に固定する。自動判定に任せると、ラベル形式の
      # 箇条書きが多い文書では少数派のほうを正解と見なして誤検出する。
      # 本文の文体は自動判定のままなので、文書ごとの使い分けは保てる。
      preferInList: "ですます"

    # 無効化: 半角カンマは識別子の列挙（`foo`, `bar`, ...）に使っており、
    # 日本語の読点過多を検出する意図と一致しない。読点そのものは max-ten が見ている。
    max-comma: false

    # 無効化: 漢字の連続長は固有名詞・専門用語で普通に超える。
    max-kanji-continuous-len: false

    # 無効化: 手順書では「〜してください」等が正当な表現。
    ja-no-weak-phrase: false
    no-exclamation-question-mark: false

  preset-jtf-style:
    # 無効化: `- **用語**` のようなラベル形式の箇条書きが多く、
    # そこへ句点を付けると読みにくくなる。
    "1.1.3.箇条書き": false
    # 無効化: `項目: 値` の半角コロンは技術文書の標準的な記法。
    "4.2.7.コロン(：)": false
    # 無効化: 日本語と半角英数の間の空白有無は機械的に矯正すると
    # 差分が本文全体に及ぶ。文書内で統一されていれば十分とする。
    "3.1.1.全角文字と半角文字の間": false
    "3.3.かっこ類と隣接する文字の間のスペースの有無": false
    "4.3.1.丸かっこ（）": false

  prh:
    rulePaths:
      - "./prh.yml"
